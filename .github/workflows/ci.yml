name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.value }}
    # defaults:
    #   run:
    #     working-directory: apps/provisioning-hub

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # bun-version-file: apps/provisioning-hub/.bun-version
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Calculate version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            VERSION="0.1.0-pr.${{ github.event.pull_request.number }}.${GITHUB_RUN_NUMBER}"
          else
            VERSION="0.1.${GITHUB_RUN_NUMBER}"
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Stamp package version
        run: npm pkg set version="${APP_VERSION}"

      - name: Run tests
        run: bun run test

      - name: Run type and lint checks
        run: bun run check

      - name: Build
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: provisioning-hub-${{ steps.version.outputs.value }}
          # path: apps/provisioning-hub/dist
          path: dist
          if-no-files-found: error
          retention-days: 30
  deploy-and-check:
    name: Publish to Power Platform and run Checker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: power-platform-dev

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download tested build
        uses: actions/download-artifact@v4
        with:
          name: provisioning-hub-${{ needs.build-and-test.outputs.version }}
          path: dist

      - name: Install Power Apps CLI
        run: npm install --global @microsoft/power-apps-cli

      - name: Publish code app
        env:
          PA_CLI_USE_SP_AUTH: "true"
          SP_CLIENT_ID: ${{ vars.PP_CLIENT_ID }}
          SP_TENANT_ID: ${{ vars.PP_TENANT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          PA_CLI_SOLUTION_ID: ${{ vars.PP_SOLUTION_ID }}
        run: pa app push --non-interactive

      - name: Export unmanaged solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ vars.PP_ENV_URL }}
          app-id: ${{ vars.PP_CLIENT_ID }}
          tenant-id: ${{ vars.PP_TENANT_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          solution-name: ${{ vars.PP_SOLUTION_NAME }}
          solution-output-file: out/ProvisionIQ-unmanaged.zip
          managed: false

      - name: Run Power Platform Checker
        uses: microsoft/powerplatform-actions/check-solution@v1
        with:
          environment-url: ${{ vars.PP_ENV_URL }}
          app-id: ${{ vars.PP_CLIENT_ID }}
          tenant-id: ${{ vars.PP_TENANT_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          path: out/ProvisionIQ-unmanaged.zip
          geo: unitedstates

      - name: Keep exported solution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provisioniq-solution-${{ needs.build-and-test.outputs.version }}
          path: out/ProvisionIQ-unmanaged.zip
          if-no-files-found: warn